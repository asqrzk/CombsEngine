# CI: workspace tests + mesh feature/wasm checks (rust), Deno check + test
# with real FFI integration (deno). Release packaging lives in release.yml.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine/core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Workspace tests
        # --no-fail-fast: a red run enumerates every failure at once
        # instead of peeling them one push per round-trip (learned on
        # 0.2.3's walk: two same-class failures cost two rounds).
        run: cargo test --release --workspace --no-fail-fast

      - name: Mesh wasm32 checks
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --release -p combs-mesh --target wasm32-unknown-unknown
          cargo check --release -p combs-mesh --target wasm32-unknown-unknown --features wasm

      - name: Mesh feature checks (host)
        run: cargo check --release -p combs-mesh --features gpu,wasm

  deno:
    # macOS so the FFI integration tests run against real Metal-backed
    # dylibs (COMBS_SKIP_INTEGRATION stays unset on purpose).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build native libraries (engine + mesh)
        working-directory: engine/core
        run: cargo build --release -p combs-ffi -p combs-mesh-ffi

      - name: Deno check + test
        working-directory: engine/js
        run: |
          deno task check
          deno task test
