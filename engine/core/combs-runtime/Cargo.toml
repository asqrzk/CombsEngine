[package]
name = "combs-runtime"
version = "0.2.3"
edition.workspace = true
license.workspace = true
description = "Combs Engine generation runtime (engine, sampler, tokenizer)"

[features]
f16 = []

[dependencies]
burn.workspace = true
combs-core.workspace = true
combs-formats = { path = "../combs-formats", version = "0.2.2" }
combs-media = { path = "../combs-media", version = "0.2.2" }
combs-models = { path = "../combs-models", version = "0.2.2" }
tokenizers.workspace = true
thiserror.workspace = true
tracing.workspace = true
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
anyhow.workspace = true
serde.workspace = true
burn = { version = "0.21.0", default-features = false, features = ["ndarray", "std"] }

# See .cargo/config.toml: the wasm browser backend for getrandom 0.3 is
# named here as a feature and there as a cfg flag; both are required.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# std's Instant panics on wasm; see src/time.rs.
web-time = "1.1"
