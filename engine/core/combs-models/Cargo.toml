[package]
name = "combs-models"
version = "0.3.0"
edition.workspace = true
license.workspace = true
description = "Combs Engine model architecture registry (Llama family)"

[features]
cpu = ["combs-core/cpu"]
# The half-precision backend, forwarded: a crate under test spells
# `--features f16` on itself and the flag reaches combs-core through here.
f16 = ["combs-core/f16"]
f16-fusion = ["f16", "combs-core/f16-fusion"]

[dependencies]
burn.workspace = true
# Direct access to burn's backend internals for the quantized linear seam
# (qlinear.rs): CubeTensor primitives, the fusion custom-op API, and the
# CubeFusionHandle bridge. Same release train as the workspace `burn`.
# `autotune` is named, not inherited: it is what makes `MatmulStrategy::default()`
# `Autotune`. Without it the default is `Cube` — the zero-output road the
# strategy door in qlinear.rs documents — and the whole batched prefill would
# take it in silence. The vendored default list still applies; this only pins
# the one feature the engine's correctness rides on.
burn-cubecl = { version = "0.21.0", features = ["autotune", "fusion", "template"] }
burn-cubecl-fusion = { version = "0.21.0" }
burn-fusion = { version = "0.21.0" }
burn-ir = { version = "0.21.0" }
cubecl = { version = "0.10.0", default-features = false, features = ["wgpu", "std"] }
combs-core.workspace = true
combs-formats = { path = "../combs-formats", version = "0.3.0" }
# The System 1 seat's batch and its readout are plain text and
# arithmetic, and live in the crate built to hold them; this crate holds
# the tensors that consume them. combs-classify links serde and nothing
# else, so the edge costs no build time and there is no cycle.
combs-classify = { path = "../combs-classify", version = "0.3.0" }
thiserror.workspace = true

[dev-dependencies]
wgpu = "29"
# The laya parity fixture is JSON, recorded by the reference
# implementation; an integration test does not inherit the crate's own
# dependencies and combs-formats pulls serde_json in regardless.
serde_json = { workspace = true }
combs-classify = { path = "../combs-classify", version = "0.3.0" }
anyhow.workspace = true
burn = { version = "0.21.0", default-features = false, features = ["ndarray", "std"] }
tokenizers.workspace = true
