[package]
name = "combs-core"
version = "0.2.3"
edition.workspace = true
license.workspace = true
description = "Combs Engine core: backend aliases, device helpers, memory facade"

[features]
f16 = []

[dependencies]
burn.workspace = true
# For the GPU allocator sample in `gpu_memory()` (Runtime::client +
# memory_usage) — same pinned version as the rest of the workspace.
cubecl = { version = "0.10.0", default-features = false, features = ["wgpu", "std"] }
serde.workspace = true
wgpu = "29"

[dev-dependencies]
burn = { version = "0.21.0", default-features = false, features = ["ndarray", "std"] }

# getrandom 0.4 reaches us transitively (burn-backend -> rand) and refuses
# to build for wasm32-unknown-unknown unless the browser backend feature is
# selected. Declared target-gated (inert on native) so a wasm check of this
# crate alone resolves without a workspace-wide rustflag.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
