[package]
name = "combs-kit"
version = "0.3.0"
edition.workspace = true
license.workspace = true
description = "Combs Kit: measure a box, a model and a build, and write a record you can compare"

[[bin]]
name = "combs-kit"
path = "src/main.rs"

[features]
# The kit must be buildable in every flavour it measures: a record says
# which build produced it, and comparing f16 against f32 is two records,
# not two code paths.
cpu = ["combs-core/cpu", "combs-runtime/cpu", "combs-models/cpu"]
f16 = ["combs-core/f16", "combs-runtime/f16"]
f16-fusion = ["f16", "combs-core/f16-fusion", "combs-runtime/f16-fusion"]

[dependencies]
combs-core.workspace = true
combs-formats = { path = "../combs-formats", version = "0.3.0" }
# For the micro cells: the launch floor, the bus and the gemv cell live
# beside the kernel canaries, where the kernels are.
combs-models = { path = "../combs-models", version = "0.3.0" }
combs-runtime = { path = "../combs-runtime", version = "0.3.0" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Only to restore SIGPIPE, so piping the kit into `head` ends quietly
# instead of panicking.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
