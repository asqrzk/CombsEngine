[package]
name = "combs-cli"
version = "0.2.2"
edition.workspace = true
license.workspace = true
description = "Combs Engine CLI (`combs` binary)"

[[bin]]
name = "combs"
path = "src/main.rs"

[features]
f16 = ["combs-core/f16", "combs-runtime/f16"]

[dependencies]
burn.workspace = true
cubecl = { version = "0.10.0", default-features = false, features = ["wgpu", "std"] }
combs-core = { path = "../combs-core", version = "0.2.2" }
combs-formats = { path = "../combs-formats", version = "0.2.2" }
combs-media = { path = "../combs-media", version = "0.2.2" }
combs-models = { path = "../combs-models", version = "0.2.2" }
combs-runtime = { path = "../combs-runtime", version = "0.2.2" }
combs-diffusion = { path = "../combs-diffusion", version = "0.2.2" }
base64.workspace = true
image.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
dialoguer.workspace = true
console.workspace = true
ureq.workspace = true
# TTS (`generate-audio`): Kokoro ONNX runs via onnxruntime — an external
# runtime by design; the burn-native port is tracked as follow-up work.
# onnxruntime backs `generate-audio` (Kokoro TTS). Upstream ships no
# prebuilt libraries for Intel macOS, so that one target loads the
# runtime dynamically at startup instead of linking it — the CLI builds
# and runs everywhere, and TTS on Intel Macs needs a locally installed
# onnxruntime.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = "2.0.0-rc.10"

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.10", features = ["load-dynamic"] }
