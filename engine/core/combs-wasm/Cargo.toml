[package]
name = "combs-wasm"
version = "0.2.3"
edition.workspace = true
license.workspace = true
description = "Combs Engine browser bindings (wasm-bindgen)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
forward-probe = []

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
combs-core.workspace = true
combs-formats.workspace = true
combs-models.workspace = true
combs-runtime.workspace = true
serde_json.workspace = true
