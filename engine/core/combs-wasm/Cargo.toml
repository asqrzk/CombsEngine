[package]
name = "combs-wasm"
version = "0.2.3"
edition.workspace = true
license.workspace = true
description = "Combs Engine browser bindings (wasm-bindgen)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
forward-probe = []
# Serve in half precision, the same switch the CLI carries. Kept a
# feature rather than a runtime flag because it selects the backend
# type: burn-fusion 0.21 panics on reduced-precision tensors, so the
# f16 build runs unfused.
f16 = ["combs-core/f16", "combs-runtime/f16"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
combs-core.workspace = true
combs-formats.workspace = true
combs-models.workspace = true
combs-runtime.workspace = true
serde_json.workspace = true
