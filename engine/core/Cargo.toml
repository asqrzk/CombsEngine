[workspace]
resolver = "2"
members = [
    "combs-core",
    "combs-formats",
    "combs-media",
    "combs-models",
    "combs-runtime",
    "combs-ffi",
    "combs-wasm",
    "combs-cli",
    "combs-mesh",
    "combs-mesh-ffi",
    "combs-graphkit",
    "combs-graphkit-ffi",
    "combs-diffusion",
    "xtask",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asqrzk/CombsEngine"

[workspace.dependencies]
burn = { version = "0.21.0", default-features = false, features = ["wgpu", "fusion", "std"] }
combs-core = { version = "0.2.2", path = "combs-core" }
combs-formats = { version = "0.2.2", path = "combs-formats" }
combs-media = { version = "0.2.2", path = "combs-media" }
combs-models = { version = "0.2.2", path = "combs-models" }
combs-runtime = { version = "0.2.2", path = "combs-runtime" }
combs-ffi = { version = "0.2.2", path = "combs-ffi" }
combs-wasm = { version = "0.2.2", path = "combs-wasm" }
combs-cli = { version = "0.2.2", path = "combs-cli" }
combs-mesh = { version = "0.2.2", path = "combs-mesh" }
combs-mesh-ffi = { version = "0.2.2", path = "combs-mesh-ffi" }
safetensors = "0.6"
memmap2 = "0.9"
half = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = "2"
tiny_http = "0.12"
dialoguer = "0.11"
console = "0.15"
ureq = { version = "3", default-features = false, features = ["rustls"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
realfft = "3"
tracing = "0.1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
crc32fast = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2