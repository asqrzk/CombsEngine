[workspace]
resolver = "2"
members = [
    "combs-core",
    "combs-formats",
    "combs-models",
    "combs-runtime",
    "combs-ffi",
    "combs-cli",
    "xtask",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/combs/combs-engine"

[workspace.dependencies]
# Burn facade: default features OFF, only the wgpu backend + std.
burn = { version = "0.21.0", default-features = false, features = ["wgpu", "fusion", "std"] }

safetensors = "0.6"
memmap2 = "0.9"
half = "2"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
