[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "combs-engine"
version = "0.1.0"
description = "Combs Engine — local-first AI inference CLI (Rust GPU core). Installs the prebuilt `combs` binary for your platform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Combs Engine contributors" }]
keywords = ["llm", "inference", "edge-ai", "local-first", "wgpu"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/asqrzk/CombsEngine"
Repository = "https://github.com/asqrzk/CombsEngine"

[project.scripts]
combs = "combs_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# CI places the per-platform binary here when building platlib wheels;
# without it the shim downloads the binary from GitHub Releases on first run.
combs_engine = ["vendor/**/*"]
